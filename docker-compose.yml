
services:
  postgres:
    image: postgres:16-alpine
    container_name: hooktrace-db
    environment:
      POSTGRES_USER: hooktrace
      POSTGRES_PASSWORD: hooktrace_dev
      POSTGRES_DB: hooktrace
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hooktrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hooktrace-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: hooktrace-api
    volumes:
      - ./services:/app/services
    environment:
      DATABASE_URL: postgresql://hooktrace:hooktrace_dev@postgres:5432/hooktrace
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: hooktrace-worker
    volumes:
      - ./services:/app/services
    environment:
      DATABASE_URL: postgresql://hooktrace:hooktrace_dev@postgres:5432/hooktrace
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1

    dns:
      - 8.8.8.8
      - 1.1.1.1
    

    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  aggregation-worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: hooktrace-aggregation-worker
    command: python -m services.worker.aggregation_worker
    volumes:
      - ./services:/app/services
    environment:
      DATABASE_URL: postgresql://hooktrace:hooktrace_dev@postgres:5432/hooktrace
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1

    dns:
    - 8.8.8.8
    - 1.1.1.1

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: hooktrace-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
      - worker

  grafana:
    image: grafana/grafana
    container_name: hooktrace-grafana
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  kafka:
    image: apache/kafka:latest
    container_name: hooktrace-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  

  rabbitmq:
    image: rabbitmq:3-management
    container_name: hooktrace-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest


  localstack:
    image: localstack/localstack:dev
    container_name: hooktrace-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEBUG: 1
      LOCALSTACK_AUTH_TOKEN: ls-sayE5357-PosU-maWu-keYA-sOwA2441d0e3
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

  grpc-test-server:
    build:
      context: .
      dockerfile: services/shared/grpc/Dockerfile

    container_name: hooktrace-grpc

    ports:
      - "50051:50051"

    restart: unless-stopped
  
volumes:
  postgres_data:
  redis_data:
  grafana_data:
  localstack_data: