name: Pre-Deploy Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pre-deploy:
    name: Validate Production Readiness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config

      # Frontend quality
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Build frontend
        working-directory: web
        run: npm run build

      # Backend container builds
      - name: Build application containers
        run: |
          docker compose build api worker grpc-test-server

      # Start core services
      - name: Start core services
        run: |
          docker compose up -d postgres redis api worker

      - name: Wait for services
        run: sleep 15

      # Production readiness
      - name: Check API health
        run: curl -f http://localhost:3001/health

      - name: Verify PostgreSQL
        run: docker exec hooktrace-db pg_isready -U hooktrace

      - name: Verify Redis
        run: docker exec hooktrace-redis redis-cli ping

      - name: Verify running containers
        run: docker compose ps

      # Debugging
      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color api || true
          docker compose logs --no-color worker || true
          docker compose logs --no-color postgres || true
          docker compose logs --no-color redis || true

      # Cleanup
      - name: Stop services
        if: always()
        run: docker compose down -v